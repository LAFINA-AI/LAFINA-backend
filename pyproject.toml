[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lafina-backend"
version = "1.0.0"
description = "LAFINA Offline-First Cloud Sync and AI Service (Vercel + Neon Postgres)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "sqladmin>=0.20.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
